[project]
name = "vulnguard"
version = "0.1.0"
description = "对照公开漏洞清单，为运行中的系统生成可复核的更新建议"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "httpx>=0.27", "packaging>=24", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
